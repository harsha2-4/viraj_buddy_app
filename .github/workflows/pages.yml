name: Deploy static preview to GitHub Pages
# Static preview only; GitHub Pages cannot host the Node voice API.
# Deliberately manual: uploading code to a private repository does not publish a site.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish web directory
        id: deployment
        uses: actions/deploy-pages@v4
